version: 4
description: "Conditional skill activation map by domain and changed paths. Includes Corey Haines marketingskills (haines_*), awesome-cursor-skills (awesome_* -> acs-*), Figma plugin skills (figma_plugin_* -> figma-*), and project Pirate Codex skills."

global:
  always_on_skills:
    - prompt-execution-governor

# Declarative gate ? enforced via .cursor/rules and prompt-execution-governor SKILL.md
skill_selection_gate:
  require_specialized_skill_before_repo_mutations: true
  require_read_skill_md_for_each_activated_skill: true
  no_domain_match_fallback: "scan_cursor_skills_descriptions_then_question_gate"
  governor_only_allowed_when: "read_only_analysis_or_pure_chat_with_explicit_no_skill_rationale"

