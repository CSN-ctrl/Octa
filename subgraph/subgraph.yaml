specVersion: 0.0.5
description: >
  ChaosStar / Sarakt — indexes SaraktLandV2 plot transfers and
  SaraktTreasury AVAX→xBGL deposit events on Avalanche Fuji (43113).
repository: https://github.com/your-org/chaosStar

schema:
  file: ./schema.graphql

dataSources:
  # ────────────────────────────────────────────────────────────
  # SaraktLandV2  (ERC-1155 land plots)
  # ────────────────────────────────────────────────────────────
  - kind: ethereum/contract
    name: SaraktLandV2
    network: avalanche-fuji
    source:
      address: "0x60FE424140720400815F068938E473E0A572b282"
      abi: SaraktLandV2
      # Free-test kit redeploy 2026-08-16 (Routescan creation tx 0xfc0d6fa1…).
      startBlock: 57793346
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PlotTransfer
      abis:
        - name: SaraktLandV2
          file: ./abis/SaraktLandV2.json
      eventHandlers:
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
      file: ./src/saraktLandV2.ts

  # ────────────────────────────────────────────────────────────
  # SaraktTreasury  (AVAX→xBGL swap deposits)
  # ────────────────────────────────────────────────────────────
  - kind: ethereum/contract
    name: SaraktTreasury
    network: avalanche-fuji
    source:
      address: "0x5b468DFA4CDBD11d307fc0221e80Ac3E2a50b284"
      abi: SaraktTreasury
      # Same creation block as SaraktLandV2 (2026-08-16 stack).
      startBlock: 57793346
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AvaxDeposit
      abis:
        - name: SaraktTreasury
          file: ./abis/SaraktTreasury.json
      eventHandlers:
        - event: AvaxSwappedForXbgl(indexed address,uint256,uint256)
          handler: handleAvaxSwappedForXbgl
      file: ./src/saraktTreasury.ts
