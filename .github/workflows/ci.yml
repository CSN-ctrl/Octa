name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  contract_changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect contract/test changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'src/contracts/**'
              - 'test/**'
              - 'foundry.toml'
              - 'lib/**'

  foundry:
    needs: contract_changes
    if: needs.contract_changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge test
        run: forge test -vv

  risk_assessment:
    runs-on: ubuntu-latest
    outputs:
      risk_tier: ${{ steps.risk.outputs.risk_tier }}
      require_chaos_drill: ${{ steps.risk.outputs.require_chaos_drill }}
      require_economic_simulation: ${{ steps.risk.outputs.require_economic_simulation }}
      touches_governance: ${{ steps.risk.outputs.touches_governance }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assess changed-path risk tier
        id: risk
        run: npm run governance:risk

  validate_base:
    needs: risk_assessment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify Vercel API function count (Hobby limit)
        run: npm run verify:vercel-api-functions

      - name: Validate contract manifest parity
        run: npm run validate:contracts

      - name: Validate governance pack
        run: npm run governance:validate-pack

      - name: Validate skill routing coverage
        run: npm run governance:check-skill-routing

      - name: Validate policy gates
        env:
          RISK_TIER: ${{ needs.risk_assessment.outputs.risk_tier }}
        run: npm run governance:policy-gates

      - name: Temporal regression guard
        run: npm run governance:regression-guard

      - name: Emit lineage telemetry
        env:
          RISK_TIER: ${{ needs.risk_assessment.outputs.risk_tier }}
        run: npm run governance:lineage

      - name: Upload governance telemetry
        uses: actions/upload-artifact@v4
        with:
          name: governance-telemetry
          path: |
            cursor-brain/governance/.last-risk-assessment.json
            cursor-brain/governance/telemetry/runs/

  validate_high_risk:
    if: needs.risk_assessment.outputs.risk_tier == 'L2' || needs.risk_assessment.outputs.risk_tier == 'L3'
    needs: risk_assessment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage

  chaos_economy_hooks:
    if: needs.risk_assessment.outputs.require_chaos_drill == 'true' || needs.risk_assessment.outputs.require_economic_simulation == 'true'
    needs: risk_assessment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run chaos/economic hooks
        env:
          REQUIRE_CHAOS_DRILL: ${{ needs.risk_assessment.outputs.require_chaos_drill }}
          REQUIRE_ECONOMIC_SIMULATION: ${{ needs.risk_assessment.outputs.require_economic_simulation }}
        run: npm run governance:hooks

      - name: Upload simulation reports
        uses: actions/upload-artifact@v4
        with:
          name: governance-simulation-reports
          path: |
            cursor-brain/governance/.last-chaos-drill-report.json
            cursor-brain/governance/.last-economic-sim-report.json
