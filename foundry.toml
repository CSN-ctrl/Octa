[profile.default]
src = "src/contracts/phase1"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
]

[profile.sandbox]
src = "src/contracts/phase1"
test = "test"
out = "out"
libs = ["lib"]

[rpc_endpoints]
local_avax = "http://192.168.88.62:9650/ext/bc/C/rpc"
sandbox_avax = "http://192.168.88.62:9650/ext/bc/C/rpc"
fuji_alchemy = "https://avax-fuji.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
